spring.application.name=campusconnect

# Application name
spring.application.name=CampusConnect

# H2 database connection
# H2 is a lightweight Java database.
spring.datasource.url=jdbc:h2:file:./data/campusconnectdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA = Java Persistence API
# Automatically creates or updates database tables.
spring.jpa.hibernate.ddl-auto=update

# Displays SQL queries in the terminal.
spring.jpa.show-sql=true

# Enables the H2 database browser.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port
server.port=8080
